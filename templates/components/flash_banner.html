<div id="flash-banner"
    class="{% if tipo == 'sucesso' or tipo == 'entrada_sucesso' %}bg-emerald-50 border-emerald-200 text-emerald-800{% elif tipo == 'saida_sucesso' %}bg-red-50 border-red-200 text-red-800{% elif tipo == 'alerta' %}bg-amber-50 border-amber-200 text-amber-800{% else %}bg-slate-50 border-slate-200 text-slate-800{% endif %} border p-3.5 rounded-lg flex items-center justify-between gap-4">
    <div class="flex items-center gap-2.5">
        <div>
            <span class="text-sm font-semibold">{{ titulo }}</span>
            {% if mensagem %}
            <span class="text-xs opacity-90 ml-1.5">{{ mensagem }}</span>
            {% endif %}
        </div>
    </div>
    {% if dismissible|default_if_none:True %}
    <button onclick="document.getElementById('flash-banner').remove()"
        class="text-slate-400 hover:text-slate-600 text-xs font-medium" title="Fechar">
        Fechar
    </button>
    {% endif %}
</div>
