<div class="bg-white rounded-2xl p-5 border border-slate-200/90 shadow-sm hover:shadow-md transition group">
    <div class="flex items-center justify-between mb-3">
        <span class="text-xs font-bold text-slate-500 uppercase tracking-wider">{{ titulo }}</span>
        <div
            class="w-10 h-10 rounded-xl flex items-center justify-center transition {% if cor == 'emerald' %}bg-emerald-50 text-emerald-600 group-hover:bg-emerald-100{% elif cor == 'coral' or cor == 'red' or cor == 'amber' %}bg-red-50 text-red-600 group-hover:bg-red-100{% elif cor == 'blue' %}bg-blue-50 text-blue-600 group-hover:bg-blue-100{% else %}bg-slate-100 text-slate-600 group-hover:bg-slate-200{% endif %}">
            {% if icone == 'entradas' %}
            <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path>
                <polyline points="10 17 15 12 10 7"></polyline>
                <line x1="15" y1="12" x2="3" y2="12"></line>
            </svg>
            {% elif icone == 'saidas' %}
            <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                <polyline points="16 17 21 12 16 7"></polyline>
                <line x1="21" y1="12" x2="9" y2="12"></line>
            </svg>
            {% elif icone == 'dias' %}
            <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                <line x1="16" y1="2" x2="16" y2="6"></line>
                <line x1="8" y1="2" x2="8" y2="6"></line>
                <line x1="3" y1="10" x2="21" y2="10"></line>
            </svg>
            {% else %}
            <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="10"></circle>
                <polyline points="12 6 12 12 16 14"></polyline>
            </svg>
            {% endif %}
        </div>
    </div>
    <div class="text-3xl font-extrabold text-slate-900 tracking-tight font-mono">{{ valor|default:"0" }}</div>
    {% if subtitulo %}
    <p class="text-[11px] text-slate-400 mt-1 font-medium">{{ subtitulo }}</p>
    {% endif %}
</div>
