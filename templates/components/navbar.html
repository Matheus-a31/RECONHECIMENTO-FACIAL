{% load static %}
<header class="bg-[#0066FF] sticky top-0 z-40 shadow-sm text-white">
    <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 h-14 flex items-center justify-between">

        <!-- Logo Oficial BatePonto -->
        <a href="{% url 'home' %}" class="flex items-center gap-2.5 font-semibold text-lg tracking-tight text-white hover:opacity-90 transition">
            <img src="{% static 'img/logo.png' %}" alt="Logo BatePonto" class="w-9 h-9 rounded-lg object-contain shadow-sm border border-white/20">
            <span>BatePonto</span>
        </a>

        <!-- Links de Navegação Simples -->
        <nav class="flex items-center gap-1 sm:gap-2 text-sm font-medium">
            <a href="{% url 'home' %}" id="nav-terminal"
                class="px-3 py-1.5 rounded-md text-white/90 hover:text-white hover:bg-white/10 transition">
                Bater ponto
            </a>

            <!-- Acesso Exclusivo a Administradores -->
            {% if request.user.is_authenticated and request.user.is_staff %}
            <a href="{% url 'historico_geral' %}" id="nav-historico-geral"
                class="px-3 py-1.5 rounded-md text-white/90 hover:text-white hover:bg-white/10 transition">
                Registros
            </a>

            <a href="{% url 'criar_funcionario' %}" id="nav-cadastrar-funcionario"
                class="px-3 py-1.5 rounded-md text-white/90 hover:text-white hover:bg-white/10 transition">
                Cadastrar
            </a>
            {% endif %}

            <a href="/admin/" target="_blank" id="nav-admin"
                class="px-2.5 py-1.5 rounded-md text-white/70 hover:text-white hover:bg-white/10 transition text-xs">
                Admin
            </a>
        </nav>
    </div>
</header>
