<div id="modal-foto-ponto"
    class="fixed inset-0 z-50 bg-slate-900/70 hidden flex items-center justify-center p-4 transition duration-150">
    <div
        class="bg-white rounded-lg max-w-md w-full overflow-hidden shadow-lg border border-slate-200 flex flex-col">

        <!-- Modal Header -->
        <div class="px-4 py-3 border-b border-slate-100 flex items-center justify-between">
            <div>
                <h4 id="modal-titulo" class="text-sm font-semibold text-slate-800">Foto do ponto</h4>
                <p id="modal-subtitulo" class="text-xs text-slate-400"></p>
            </div>
            <button id="modal-foto-fechar" type="button" onclick="fecharFotoModal()"
                class="text-slate-400 hover:text-slate-600 p-1 rounded transition text-xs">
                ✕
            </button>
        </div>

        <!-- Foto Frame -->
        <div class="p-3 bg-slate-900 flex items-center justify-center min-h-[250px]">
            <img id="modal-foto-img" src="" alt="Comprovante"
                class="max-h-80 w-auto object-contain rounded">
        </div>

        <!-- Modal Footer -->
        <div class="px-4 py-2.5 bg-slate-50 border-t border-slate-100 flex items-center justify-end">
            <button type="button" onclick="fecharFotoModal()"
                class="text-xs font-medium px-3 py-1.5 rounded bg-white border border-slate-200 hover:bg-slate-50 text-slate-700 transition">
                Fechar
            </button>
        </div>

    </div>
</div>

<script>
    function abrirFotoModal(url, nome, tipo, horario) {
        const modal = document.getElementById('modal-foto-ponto') || document.getElementById('foto-modal');
        const img = document.getElementById('modal-foto-img') || document.getElementById('modal-img');
        const titulo = document.getElementById('modal-titulo');
        const subtitulo = document.getElementById('modal-subtitulo');

        if (img) img.src = url || '';
        if (titulo) titulo.textContent = `${nome || 'Colaborador'} — ${tipo || 'Registro'}`;
        if (subtitulo) subtitulo.textContent = horario ? `Capturado em: ${horario}` : 'Comprovante biométrico';
        if (modal) modal.classList.remove('hidden');
    }

    function fecharFotoModal() {
        const modal = document.getElementById('modal-foto-ponto') || document.getElementById('foto-modal');
        if (modal) modal.classList.add('hidden');
    }

    document.addEventListener('click', function (e) {
        const trigger = e.target.closest('[data-modal-foto-trigger]');
        if (trigger) {
            e.preventDefault();
            abrirFotoModal(
                trigger.getAttribute('data-foto-url'),
                trigger.getAttribute('data-funcionario-nome'),
                trigger.getAttribute('data-tipo'),
                trigger.getAttribute('data-horario')
            );
            return;
        }

        const modal = document.getElementById('modal-foto-ponto');
        if (modal && e.target === modal) {
            fecharFotoModal();
        }
    });

    document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape') fecharFotoModal();
    });
</script>
